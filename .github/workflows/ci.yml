name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  firestore-rules:
    name: Firestore Rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      # Java est préinstallé sur les runners ubuntu-latest — nécessaire pour
      # l'émulateur Firestore (jamais exécuté en local faute de Java, voir
      # CLAUDE.md section Tests & QA).
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:rules
