  <!-- Schema.org structured data -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background-color: #0A1628; }
    #splash-overlay {
      position: fixed; inset: 0;
      background: #0A1628;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash-overlay.fade-out { opacity: 0; pointer-events: none; }
    .splash-logo {
      display: flex; flex-direction: column; align-items: center; gap: 24px;
    }
    .splash-logo img { width: 100px; height: 100px; border-radius: 24px; }
    .splash-title {
      color: #FF6B00; font-size: 32px; font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: -0.5px;
    }
    .splash-loader {
      width: 40px; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 2px; overflow: hidden;
    }
    .splash-loader-bar {
      height: 100%; width: 40%; background: #FF6B00;
      border-radius: 2px;
      animation: loader 1.4s ease-in-out infinite;
    }
    @keyframes loader {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .center {
      margin: 0; position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .contain { display:block; width:100%; height:100%; object-fit:contain; }
  </style>
</head>
<body>
  <!-- Custom branded splash -->
  <div id="splash-overlay">
    <div class="splash-logo">
      <img src="icons/Icon-192.png" alt="AZ Express" onerror="this.style.display='none'">
      <div class="splash-title">AZ Express</div>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async="" onload="
    const overlay = document.getElementById('splash-overlay');
    if(overlay) {
      setTimeout(() => {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.remove(), 500);
      }, 800);
    }
  "></script>
</body>
</html>
