# Master Prompt "Correction définitive du build Android (Out Of Memory)" —
# cause réelle confirmée : un daemon Gradle (PID observé, ~2,7 Go RSS) restait
# actif en arrière-plan malgré `org.gradle.daemon=false` ci-dessous (un
# daemon déjà lancé avant ce réglage, ou lancé séparément par Android Studio,
# n'est jamais tué par ce seul flag), saturant la mémoire système disponible
# pour tout nouveau build. Le daemon et le build bloqué ont été arrêtés
# manuellement (Étape 3). En plus de ce nettoyage, -Xmx relevé de 2g à 3g en
# marge de sécurité : `kotlin.compiler.execution.strategy=in-process`
# (ci-dessous) force déjà le compilateur Kotlin à partager ce même tas Java
# plutôt qu'un daemon Kotlin séparé avec son propre tas — 2g était trop juste
# pour Gradle + AGP + Kotlin + R8 cumulés dans un seul processus.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Désactivé : bug connu du cache incrémental Kotlin sous Windows quand le projet
# (D:\...) et le Pub Cache Flutter (C:\...) sont sur des lettres de lecteur différentes
# (RelocatableFileToPathConverter ne peut pas calculer de chemin relatif cross-drive).
kotlin.incremental=false
# Force la compilation Kotlin en processus (dans le worker Gradle) plutôt que via un
# daemon Kotlin externe séparé — élimine "Daemon compilation failed" / "Storage is
# already registered", causé par un état de cache corrompu accumulé entre sessions
# du daemon Kotlin sur Windows, distinct du daemon Gradle (déjà désactivé ci-dessus).
kotlin.compiler.execution.strategy=in-process
